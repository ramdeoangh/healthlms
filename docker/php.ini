; Overrides recommended in Academy LMS's Administrator Usage Guide
; (needed for uploading video lessons and long-running admin actions)
upload_max_filesize = 256M
post_max_size = 260M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
allow_url_fopen = On

; Some addon/updater scripts (e.g. the Certificate addon's sql/updater.php)
; echo output before the app tries to redirect(), which fails with "headers
; already sent" when output isn't buffered. Buffering avoids that.
output_buffering = 4096

; Restore pre-PHP-8.1 mysqli error behavior for this legacy app (see file for why)
auto_prepend_file = /var/www/html/docker/mysqli-compat.php
